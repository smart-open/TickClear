name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Build + Lint + Unit Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      # release 变体启用 R8 + shrinkResources。此前 CI 从不构建 release，
      # proguard keep 规则缺漏（Opus native / SQLCipher JNI 等）只能在发版后暴露。
      # 无 release 签名时 build.gradle.kts 会自动回退 debug 签名，CI 上可直接构建。
      - name: Assemble release (R8 + shrinkResources gate)
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Lint (release, abortOnError)
        run: ./gradlew :app:lintRelease --no-daemon
      - name: Unit tests + Jacoco coverage
        run: ./gradlew :app:createDebugUnitTestCoverageReport --no-daemon
      - name: Upload unit-test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: app/build/reports/coverage/debug

  instrumented-test:
    name: Instrumented Test (Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected
