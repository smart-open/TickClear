# Gradle / JVM
# -Xshare:off：关闭 JVM CDS（Class Data Sharing）。JDK 17+ 下 Gradle 守护进程的
# instrumentation agent 会追加 bootstrap classpath，与 CDS 冲突并刷警告：
#   "Sharing is only supported for boot loader classes because bootstrap classpath has been appended"
# 关闭后仅损失守护进程启动的毫秒级共享收益，构建行为无任何变化。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Xshare:off
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# AGP 8.5.2 官方测试上限为 compileSdk 34；本项目 :app/:core/:data 统一 compileSdk 35，
# 已验证可正常编译运行，抑制 AGP 的兼容性警告（升级 AGP 后可移除）。
android.suppressUnsupportedCompileSdk=35
